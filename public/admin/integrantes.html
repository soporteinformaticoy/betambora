<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes - Tambora Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <script src="/admin/js/auth.js" defer></script>
    <script src="/admin/js/api.js" defer></script>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🥁 Tambora</h2>
                <p id="user-info">Cargando...</p>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="/admin/dashboard.html" class="nav-link">📊 Dashboard</a></li>
                    <li class="nav-item"><a href="/admin/agrupaciones.html" class="nav-link">🎭 Agrupaciones</a></li>
                    <li class="nav-item"><a href="/admin/integrantes.html" class="nav-link active">👥 Integrantes</a>
                    </li>
                    <li class="nav-item"><a href="/admin/eventos.html" class="nav-link">📅 Eventos</a></li>
                    <li class="nav-item"><a href="/" class="nav-link">🗺️ Mapa Público</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="logoutBtn">🚪 Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h1>Integrantes</h1>
                <button class="btn btn-primary" id="btnNuevo">+ Nuevo Integrante</button>
            </div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Agrupación</th>
                                <th>Experiencia</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" style="text-align: center;">
                                    <div class="spinner"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Integrante</h2>
            </div>
            <form id="integranteForm">
                <input type="hidden" id="integranteId">

                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido *</label>
                    <input type="text" id="apellido" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="rol">Rol *</label>
                    <select id="rol" class="form-control" required>
                        <option value="">Seleccionar...</option>
                        <option value="Propietario">Propietario</option>
                        <option value="Director">Director</option>
                        <option value="Jefe de Cuerda">Jefe de Cuerda</option>
                        <option value="Vedette">Vedette</option>
                        <option value="Coreógrafa">Coreógrafa</option>
                        <option value="Gramillero">Gramillero</option>
                        <option value="Bandera">Bandera</option>
                        <option value="Bailarina">Bailarina</option>
                        <option value="Tamborilero">Tamborilero</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="agrupacion">Agrupación *</label>
                    <select id="agrupacion" class="form-control" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="experienciaAños">Años de Experiencia</label>
                    <input type="number" id="experienciaAños" class="form-control" min="0">
                </div>

                <div class="form-group">
                    <label for="biografia">Biografía</label>
                    <textarea id="biografia" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            Auth.checkAuth();
            document.getElementById('user-info').textContent = Auth.getUser().username;
            document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

            const modal = document.getElementById('modal');
            const form = document.getElementById('integranteForm');
            let currentId = null;

            async function loadAgrupacionesSelect() {
                const agrupaciones = await API.getAgrupaciones();
                const select = document.getElementById('agrupacion');
                select.innerHTML = '<option value="">Seleccionar...</option>' +
                    agrupaciones.map(a => `<option value="${a._id}">${a.nombre}</option>`).join('');
            }

            async function loadIntegrantes() {
                try {
                    const integrantes = await API.getIntegrantes();
                    const tbody = document.getElementById('tableBody');

                    if (integrantes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay integrantes registrados</td></tr>';
                        return;
                    }

                    tbody.innerHTML = integrantes.map(i => `
                    <tr>
                        <td><strong>${i.nombre} ${i.apellido}</strong></td>
                        <td><span class="badge badge-info">${i.rol}</span></td>
                        <td>${i.agrupacion?.nombre || 'N/A'}</td>
                        <td>${i.experienciaAños ? i.experienciaAños + ' años' : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editIntegrante('${i._id}')">Editar</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteIntegrante('${i._id}', '${i.nombre} ${i.apellido}')">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
                } catch (error) {
                    showAlert('Error al cargar integrantes: ' + error.message, 'error');
                }
            }

            document.getElementById('btnNuevo').addEventListener('click', async () => {
                currentId = null;
                form.reset();
                await loadAgrupacionesSelect();
                document.getElementById('modalTitle').textContent = 'Nuevo Integrante';
                modal.classList.add('active');
            });

            document.getElementById('btnCancelar').addEventListener('click', () => modal.classList.remove('active'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const data = {
                    nombre: document.getElementById('nombre').value,
                    apellido: document.getElementById('apellido').value,
                    rol: document.getElementById('rol').value,
                    agrupacion: document.getElementById('agrupacion').value,
                    experienciaAños: document.getElementById('experienciaAños').value || undefined,
                    biografia: document.getElementById('biografia').value
                };

                try {
                    if (currentId) {
                        await API.updateIntegrante(currentId, data);
                        showAlert('Integrante actualizado exitosamente');
                    } else {
                        await API.createIntegrante(data);
                        showAlert('Integrante creado exitosamente');
                    }
                    modal.classList.remove('active');
                    loadIntegrantes();
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            });

            window.editIntegrante = async (id) => {
                try {
                    currentId = id;
                    await loadAgrupacionesSelect();
                    const integrante = await API.getIntegrante(id);

                    document.getElementById('nombre').value = integrante.nombre;
                    document.getElementById('apellido').value = integrante.apellido;
                    document.getElementById('rol').value = integrante.rol;
                    document.getElementById('agrupacion').value = integrante.agrupacion._id;
                    document.getElementById('experienciaAños').value = integrante.experienciaAños || '';
                    document.getElementById('biografia').value = integrante.biografia || '';

                    document.getElementById('modalTitle').textContent = 'Editar Integrante';
                    modal.classList.add('active');
                } catch (error) {
                    showAlert('Error al cargar integrante: ' + error.message, 'error');
                }
            };

            window.deleteIntegrante = async (id, nombre) => {
                if (!confirmDelete(`¿Eliminar a "${nombre}"?`)) return;

                try {
                    await API.deleteIntegrante(id);
                    showAlert('Integrante eliminado exitosamente');
                    loadIntegrantes();
                } catch (error) {
                    showAlert('Error al eliminar: ' + error.message, 'error');
                }
            };

            loadIntegrantes();
        });
    </script>
</body>

</html>
